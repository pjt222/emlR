on:
  push:
    branches: [main, master]
  release:
    types: [published]
  workflow_dispatch:

name: pkgdown

# Opt every JavaScript action into Node 24 ahead of GitHub's June 2026
# default switch. The r-lib/* and actions/* runners still ship a Node 20
# manifest at the time of writing; this flag tells the runner to execute
# them on Node 24 anyway. Once those actions publish a Node-24 manifest
# this env can be removed.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Permissions for the modern GitHub Pages deployment flow:
# read source, write pages artifact, request OIDC token for deploy.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, but do not cancel in-progress
# deploys — we want the latest commit's build to complete and publish
# even if it queued behind an earlier one.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown
          needs: website

      - name: Install package
        run: R CMD INSTALL --no-multiarch --with-keep.source .

      - name: Build site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
